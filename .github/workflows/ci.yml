name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        # The runners' package mirrors sometimes fail for a while: retry with timeouts, then check.
        timeout-minutes: 20
        run: |
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo apt-get $A update && sudo apt-get $A install -y --fix-missing libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev && break
            sleep 30
          done
          dpkg -s libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run build:ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI tests (Playwright, against the real engine through the test server)
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          cargo build -q -p datum-core --example serve
          NODE_PATH=$(npm root -g) node tests_ui/run.cjs
      - name: Production dependencies have no known high-severity advisories
        run: npm audit --omit=dev --audit-level=high

  # Licences, security advisories and crate sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The engine and the app build and pass their tests on Windows and macOS too.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace
